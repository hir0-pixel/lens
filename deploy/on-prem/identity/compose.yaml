name: lens-identity-lab

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LENS_IDENTITY_DATABASE_NAME}
      POSTGRES_USER: ${LENS_IDENTITY_DATABASE_USER}
      POSTGRES_PASSWORD: ${LENS_IDENTITY_DATABASE_PASSWORD}
    volumes:
      - identity_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - identity_internal

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${LENS_IDENTITY_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${LENS_IDENTITY_ADMIN_PASSWORD}
      LENS_SESSION_GATEWAY_CLIENT_SECRET: ${LENS_SESSION_GATEWAY_CLIENT_SECRET}
      KC_DB: postgres
      KC_DB_URL_HOST: database
      KC_DB_URL_DATABASE: ${LENS_IDENTITY_DATABASE_NAME}
      KC_DB_USERNAME: ${LENS_IDENTITY_DATABASE_USER}
      KC_DB_PASSWORD: ${LENS_IDENTITY_DATABASE_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME: https://identity.platform.internal:8443
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./lens-internal-realm.json:/opt/keycloak/data/import/lens-internal-realm.json:ro
    networks:
      - identity_internal

  edge:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      - keycloak
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LENS_EDGE_RELAY_TOKEN: ${LENS_EDGE_RELAY_TOKEN}
      LENS_SESSION_GATEWAY_EDGE_TOKEN: ${LENS_SESSION_GATEWAY_EDGE_TOKEN}
    ports:
      - "${LENS_IDENTITY_BIND_ADDRESS:-127.0.0.1}:8443:8443"
      - "${LENS_IDENTITY_BIND_ADDRESS:-127.0.0.1}:8444:8444"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - identity_edge_data:/data
    networks:
      identity_internal:
        aliases:
          - identity.platform.internal
      identity_edge: {}

  session_gateway:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    command: node scripts/identity-session-gateway.mjs
    environment:
      NODE_EXTRA_CA_CERTS: /caddy-data/caddy/pki/authorities/local/root.crt
      LENS_SESSION_GATEWAY_MODE: ${LENS_SESSION_GATEWAY_MODE}
      LENS_SESSION_GATEWAY_PORT: ${LENS_SESSION_GATEWAY_PORT}
      LENS_IDENTITY_ISSUER: ${LENS_IDENTITY_ISSUER}
      LENS_SESSION_GATEWAY_CLIENT_ID: ${LENS_SESSION_GATEWAY_CLIENT_ID}
      LENS_SESSION_GATEWAY_CLIENT_SECRET: ${LENS_SESSION_GATEWAY_CLIENT_SECRET}
      LENS_SESSION_GATEWAY_ALLOWED_ORIGIN: ${LENS_SESSION_GATEWAY_ALLOWED_ORIGIN}
      LENS_SESSION_GATEWAY_EDGE_TOKEN: ${LENS_SESSION_GATEWAY_EDGE_TOKEN}
      LENS_SESSION_GATEWAY_REDIRECT_URI: ${LENS_SESSION_GATEWAY_REDIRECT_URI}
      LENS_INTERNAL_MODEL_BRIDGE_URL: ${LENS_INTERNAL_MODEL_BRIDGE_URL}
      LENS_INTERNAL_MODEL_BRIDGE_TOKEN: ${LENS_INTERNAL_MODEL_BRIDGE_TOKEN}
    volumes:
      - ../../..:/app:ro
      - identity_edge_data:/caddy-data:ro
    networks:
      - identity_internal

networks:
  identity_internal:
    internal: true
  identity_edge: {}

volumes:
  identity_database:
  identity_edge_data:
