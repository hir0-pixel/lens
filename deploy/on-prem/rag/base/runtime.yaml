            exec:
              command: ["/bin/sh", "-c", "test -f /var/run/secrets/lens-workload-identity/token"]
            failureThreshold: 20
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /var/run/secrets/lens-workload-identity/token"]
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /var/run/secrets/lens-workload-identity/token"]
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 30"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workload-identity
              mountPath: /var/run/secrets/lens-workload-identity
              readOnly: true
            - name: tls-server
              mountPath: /var/run/lens/tls
              readOnly: true
            - name: mtls-ca
              mountPath: /var/run/lens/mtls
              readOnly: true
      volumes:
        - name: workload-identity
          projected:
            sources:
              - serviceAccountToken:
                  audience: lens.platform.internal
                  expirationSeconds: 3600
                  path: token
        - name: tls-server
          secret:
            secretName: lens-ingestion-pod-tls
        - name: mtls-ca
          secret:
            secretName: lens-service-mtls-ca
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lens-ingestion
  annotations:
    workloadIdentity: disruption-budget-protects-ingestion-workload-identity-capacity
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lens-ingestion
