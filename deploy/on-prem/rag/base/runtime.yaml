# workloadIdentity: runtime resources bind each service to a distinct ServiceAccount and projected identity token
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bff-workload
  annotations:
    workloadIdentity: spiffe://lens.platform.internal/ns/lens-rag/sa/bff-workload
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator-workload
  annotations:
    workloadIdentity: spiffe://lens.platform.internal/ns/lens-rag/sa/orchestrator-workload
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: retrieval-workload
  annotations:
    workloadIdentity: spiffe://lens.platform.internal/ns/lens-rag/sa/retrieval-workload
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingestion-workload
  annotations:
