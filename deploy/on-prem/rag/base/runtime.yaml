automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dr-ops-workload
  annotations:
    workloadIdentity: spiffe://lens.platform.internal/ns/lens-rag/sa/dr-ops-workload
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: lens-bff
  labels:
    app.kubernetes.io/name: lens-bff
  annotations:
    workloadIdentity: ingress-terminates-at-private-boundary-bff-workload-only
    lens.platform.internal/privateDnsName: lens.platform.internal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lens-bff
  ports:
    - name: https-app
      port: 3001
      targetPort: https-app
      protocol: TCP
      appProtocol: https
---
apiVersion: v1
kind: Service
metadata:
  name: lens-orchestrator
  labels:
    app.kubernetes.io/name: lens-orchestrator
