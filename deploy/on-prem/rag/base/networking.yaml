            matchLabels:
              lens.platform.internal/role: governance
      ports:
        - protocol: TCP
          port: 9444
    - to:
        - namespaceSelector:
            matchLabels:
              lens.platform.internal/role: audit
      ports:
        - protocol: TCP
          port: 9445
    - to:
        - namespaceSelector:
            matchLabels:
              lens.platform.internal/role: content-store
      ports:
        - protocol: TCP
          port: 9446
    - to:
        - namespaceSelector:
            matchLabels:
              lens.platform.internal/role: retrieval-index
      ports:
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 6334
