  annotations:
    workloadIdentity: spiffe://lens.platform.internal/ns/lens-rag/sa/dr-ops-workload
    lens.platform.internal/recovery-class: restore-cell
spec:
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            workloadIdentity: spiffe://lens.platform.internal/ns/lens-rag/sa/dr-ops-workload
