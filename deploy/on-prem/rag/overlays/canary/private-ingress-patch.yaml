# workloadIdentity: canary overlay preserves workload identities and moves traffic to a separate private canary hostname
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lens-bff-private
  annotations:
    workloadIdentity: private-canary-ingress-still-targets-bff-workload-identity
    lens.platform.internal/canary: "true"
spec:
  tls:
    - hosts:
        - lens-canary.platform.internal
      secretName: lens-bff-canary-edge-tls
  rules:
    - host: lens-canary.platform.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lens-bff
                port:
                  number: 3001
